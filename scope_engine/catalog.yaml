version: 1
verticals:
  - id: hvac
    name: HVAC
    keywords: [hvac, air conditioning, duct, ahu, chiller, vrf, ventilation, cooling]
    capabilities: [engineering_calculation, quantity_takeoff, boq, energy_analysis]
  - id: firefighting
    name: Firefighting
    keywords: [fire fighting, firefighting, hydrant, sprinkler, fire pump, hose reel, fire alarm]
    capabilities: [engineering_calculation, quantity_takeoff, compliance]
  - id: plumbing
    name: Plumbing
    keywords: [plumbing, water supply, drainage, sanitary, soil pipe, waste pipe, pump]
    capabilities: [engineering_calculation, quantity_takeoff, boq]
  - id: bms
    name: BMS
    keywords: [bms, building management system, ddc, bacnet, modbus, io points, controls]
    capabilities: [engineering_calculation, quantity_takeoff, boq, controls]
  - id: interiors
    name: Interiors
    keywords: [interior, fitout, partition, gypsum, ceiling, flooring, tiling, painting, furniture, joinery]
    capabilities: [quantity_takeoff, boq, procurement]
  - id: electrical
    name: Electrical
    keywords: [electrical, cable, panel, mdb, db, lighting, socket, earthing, transformer]
    capabilities: [engineering_calculation, quantity_takeoff, boq, compliance]
  - id: civil
    name: Civil / Building Construction
    keywords: [civil, concrete, rebar, reinforcement, masonry, brickwork, excavation, slab, foundation]
    capabilities: [engineering_calculation, quantity_takeoff, boq]
  - id: lsg_audit
    name: LSG / Life-Safety Audit
    keywords: [lsg audit, life safety audit, safety audit, fire safety audit, building safety audit]
    capabilities: [audit, compliance, evidence_review, corrective_action]
  - id: energy_audit
    name: Energy Audit
    keywords: [energy audit, energy assessment, energy baseline, energy consumption, energy efficiency]
    capabilities: [audit, energy_analysis, compliance, decarbonization]
  - id: decarbonization
    name: Decarbonization
    keywords: [decarbonization, decarbonisation, carbon reduction, net zero, emissions reduction, abatement]
    capabilities: [carbon_accounting, scenario_analysis, energy_analysis, project_planning]
  - id: carbon_credits
    name: Carbon Credits / Carbon Projects
    keywords: [carbon credit, carbon credits, carbon project, carbon registry, mrv, additionality, offset]
    capabilities: [carbon_accounting, mrv, evidence_review, registry_workflow]
  - id: renewable_energy
    name: Renewable Energy / PPA
    keywords: [solar, renewable energy, ppa, open access, rooftop, bess, battery storage]
    capabilities: [engineering_calculation, energy_analysis, commercial_analysis, quantity_takeoff]

recipes:
  - id: gypsum_wall_partition
    name: Gypsum Wall Partition
    verticals: [interiors]
    validated: true   # matches the company's live SiteTrack Work Library recipe (read 2026-10-12)
    source: SiteTrack Work Library, work type "Gypsum partition"
    base_unit: sqft
    aliases: [gypsum partition, gypsum wall, drywall partition, gypsum board partition]
    quantity_patterns:
      - '(\d[\d,.]*)\s*(?:sq\.?\s*ft|sqft|square\s*feet)'
    materials:
      - {name: Gypsum Board 12mm, unit: sqft, consumption_per_unit: 2.1, wastage_percent: 5}
      - {name: Floor/Ceiling Track, unit: rft, consumption_per_unit: 0.22, wastage_percent: 5}
      - {name: E Section / Stud, unit: rft, consumption_per_unit: 0.7, wastage_percent: 5}
      - {name: Screws, unit: nos, consumption_per_unit: 4, wastage_percent: 5}
      - {name: Jointing Compound, unit: kg, consumption_per_unit: 0.1, wastage_percent: 5}
      - {name: Gypsum Tape, unit: m, consumption_per_unit: 0.5, wastage_percent: 5}
      - {name: Anchors/Fasteners, unit: nos, consumption_per_unit: 0.5, wastage_percent: 5}
  - id: vitrified_tile_flooring
    name: Vitrified Tile Flooring
    verticals: [interiors]
    validated: false
    base_unit: sqft
    aliases: [vitrified tile, tile flooring, floor tiling, vitrified flooring]
    quantity_patterns:
      - '(\d[\d,.]*)\s*(?:sq\.?\s*ft|sqft|square\s*feet)'
    materials:
      - {name: Vitrified Tiles, unit: sqft, consumption_per_unit: 1.05, wastage_percent: 5}
      - {name: Cement, unit: kg, consumption_per_unit: 4, wastage_percent: 5}
      - {name: Sand, unit: kg, consumption_per_unit: 10, wastage_percent: 5}
      - {name: Tile Adhesive, unit: kg, consumption_per_unit: 3, wastage_percent: 5}
      - {name: Grout, unit: kg, consumption_per_unit: 0.3, wastage_percent: 0}
      - {name: Spacers, unit: nos, consumption_per_unit: 4, wastage_percent: 0}
  - id: gi_duct_fabrication
    name: GI Duct Fabrication
    verticals: [hvac]
    validated: false
    notes: Starter factors for flanges, bolts, rivets, gasket, sealant and hangers. Confirm against your shop-drawing practice.
    base_unit: sqm
    aliases: [gi duct, galvanised duct, galvanized duct, gi sheet metal duct, rectangular duct, sheet metal duct]
    quantity_patterns:
      - '(\d[\d,.]*)\s*(?:sqm|sq\.?\s*m|m2)'
    materials:
      - {name: GI Sheet (duct surface area), unit: sqm, consumption_per_unit: 1.0, wastage_percent: 8}
      - {name: Flange Angle / Slip Joints, unit: rft, consumption_per_unit: 1.2, wastage_percent: 5}
      - {name: "Nuts, Bolts and Washers", unit: nos, consumption_per_unit: 4, wastage_percent: 5}
      - {name: Rivets, unit: nos, consumption_per_unit: 6, wastage_percent: 5}
      - {name: Duct Gasket / Sealing Tape, unit: rft, consumption_per_unit: 1.0, wastage_percent: 5}
      - {name: Duct Sealant, unit: kg, consumption_per_unit: 0.05, wastage_percent: 5}
      - {name: Duct Hangers (threaded rod and angle), unit: nos, consumption_per_unit: 0.3, wastage_percent: 5}
  - id: duct_thermal_insulation
    name: Duct Thermal Insulation
    verticals: [hvac]
    validated: false
    notes: Starter factors for adhesive, joint tape and fixing pins. Confirm against the insulation maker's guidance.
    base_unit: sqm
    aliases: [duct insulation, thermal insulation of duct, duct lagging, duct thermal insulation, duct thermal & acoustic insulation, nitrile rubber insulation, acoustic lining]
    quantity_patterns:
      - '(\d[\d,.]*)\s*(?:sqm|sq\.?\s*m|m2)'
    materials:
      - {name: Insulation Material (surface area), unit: sqm, consumption_per_unit: 1.0, wastage_percent: 5}
      - {name: Insulation Adhesive, unit: ltr, consumption_per_unit: 0.25, wastage_percent: 5}
      - {name: Aluminium Foil Tape / Joint Tape, unit: m, consumption_per_unit: 1.5, wastage_percent: 5}
      - {name: Insulation Fixing Pins / Clips, unit: nos, consumption_per_unit: 2, wastage_percent: 5}
  # Standard-practice starter factors (not company-validated): confirm or replace via recipes_csv. Assumptions are in `notes`.
  - id: gypsum_false_ceiling
    name: Gypsum False Ceiling
    verticals: [interiors]
    validated: false
    notes: 12.5 mm board on GI grid, main channel at 1.2 m, cross channel at about 0.45 m, hangers at 1.2 m.
    base_unit: sqft
    aliases: [gypsum ceiling, gypsum false ceiling, false ceiling gypsum, gypsum board ceiling, drywall ceiling]
    materials:
      - {name: Gypsum Board 12.5mm, unit: sqft, consumption_per_unit: 1.0, wastage_percent: 5}
      - {name: Main Channel, unit: rft, consumption_per_unit: 0.25, wastage_percent: 5}
      - {name: Cross/Furring Channel, unit: rft, consumption_per_unit: 0.7, wastage_percent: 5}
      - {name: Perimeter Angle, unit: rft, consumption_per_unit: 0.12, wastage_percent: 5}
      - {name: Hangers/Clips, unit: nos, consumption_per_unit: 0.07, wastage_percent: 5}
      - {name: Screws, unit: nos, consumption_per_unit: 2.5, wastage_percent: 5}
      - {name: Jointing Compound, unit: kg, consumption_per_unit: 0.1, wastage_percent: 5}
      - {name: Gypsum Tape, unit: m, consumption_per_unit: 0.5, wastage_percent: 5}
  - id: gypsum_ceiling_tiles
    name: Grid Ceiling Tiles
    verticals: [interiors]
    validated: false
    notes: 600 x 600 tiles on exposed T-grid, main tee at 1.2 m, cross tees at 1.2 m and 0.6 m.
    base_unit: sqft
    aliases: [gypsum ceiling tiles, gypsum tile ceiling, grid ceiling, mineral fibre ceiling, tile ceiling, 600x600 ceiling]
    materials:
      - {name: Ceiling Tiles 600x600, unit: sqft, consumption_per_unit: 1.0, wastage_percent: 5}
      - {name: Main Tee, unit: rft, consumption_per_unit: 0.25, wastage_percent: 5}
      - {name: Cross Tee 1200, unit: rft, consumption_per_unit: 0.25, wastage_percent: 5}
      - {name: Cross Tee 600, unit: rft, consumption_per_unit: 0.5, wastage_percent: 5}
      - {name: Wall Angle, unit: rft, consumption_per_unit: 0.12, wastage_percent: 5}
      - {name: Hangers/Clips, unit: nos, consumption_per_unit: 0.07, wastage_percent: 5}
  - id: aluminium_partition_particle_board
    name: Aluminium Partition with Particle Board
    verticals: [interiors]
    validated: false
    notes: Aluminium frame about 3 m high, 1.2 m modules, 12 mm particle board on both faces.
    base_unit: sqft
    aliases: [aluminium partition, aluminum partition, aluminium partition with particle board, aluminium particle board partition]
    materials:
      - {name: Aluminium Sections, unit: rft, consumption_per_unit: 0.7, wastage_percent: 7}
      - {name: Particle Board 12mm, unit: sqft, consumption_per_unit: 2.0, wastage_percent: 5}
      - {name: Gasket/Beading, unit: rft, consumption_per_unit: 0.7, wastage_percent: 5}
      - {name: Screws/Rivets, unit: nos, consumption_per_unit: 6, wastage_percent: 5}
      - {name: Anchors/Fasteners, unit: nos, consumption_per_unit: 0.5, wastage_percent: 5}
  - id: frameless_glass_partition
    name: Frameless Glass Partition
    verticals: [interiors]
    validated: false
    notes: 12 mm toughened glass, about 3 m high, top and bottom aluminium U-channel, silicone joints.
    base_unit: sqft
    aliases: [frameless glass partition, frameless glass, glass partition, toughened glass partition]
    materials:
      - {name: Toughened Glass 12mm, unit: sqft, consumption_per_unit: 1.0, wastage_percent: 3}
      - {name: Aluminium U-Channel, unit: rft, consumption_per_unit: 0.2, wastage_percent: 5}
      - {name: Silicone Sealant, unit: kg, consumption_per_unit: 0.02, wastage_percent: 5}
      - {name: Patch Fittings/Hardware, unit: nos, consumption_per_unit: 0.03, wastage_percent: 0}
      - {name: Glass Gasket/Packers, unit: rft, consumption_per_unit: 0.1, wastage_percent: 5}
  - id: wall_tile_work
    name: Wall Tile Work
    verticals: [interiors]
    validated: false
    base_unit: sqft
    aliases: [wall tiles, wall tile, wall tiling, wall cladding tiles]
    materials:
      - {name: Wall Tiles, unit: sqft, consumption_per_unit: 1.0, wastage_percent: 7}
      - {name: Tile Adhesive, unit: kg, consumption_per_unit: 2.5, wastage_percent: 5}
      - {name: Grout, unit: kg, consumption_per_unit: 0.25, wastage_percent: 0}
      - {name: Spacers, unit: nos, consumption_per_unit: 4, wastage_percent: 0}
  # Supply-and-lay items for tender BOQs. {spec} is replaced by the size text of the BOQ line. Factors are unvalidated starters.
  - id: mv_cable_supply
    name: MV Armoured Cable
    verticals: [electrical]
    validated: false
    notes: Cable by size plus 3% cutting wastage. Glands, lugs, tags and sleeves assume an average run of about 50 m with two ends. Trenching is not included.
    base_unit: m
    aliases: [mv cable, armoured cable, pvc sheathed, xlpe insulated, power cable, control cable]
    materials:
      - {name: "Armoured cable {spec}", unit: m, consumption_per_unit: 1.0, wastage_percent: 3}
      - {name: Cable Glands (double compression), unit: nos, consumption_per_unit: 0.04, wastage_percent: 0}
      - {name: Cable Lugs / Terminals, unit: nos, consumption_per_unit: 0.04, wastage_percent: 0}
      - {name: Cable Ties / Clamps, unit: nos, consumption_per_unit: 2, wastage_percent: 5}
