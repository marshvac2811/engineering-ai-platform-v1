  - cooling load
  - hvac load
  - tonnage
  - tons of ac
  - sq ft per ton
  - air conditioning load
- skill_id: duct_sizing
  domain: HVAC
  source_repository: duct-sizing-calculator
  source_path: .
  execution: deterministic_python
  classification: preliminary
  integration_status: integrated
  human_review_required: true
  required_inputs:
  - name: airflow
    data_type: number
    description: Required airflow.
  - name: method
    data_type: string
    allowed_values:
    - velocity
    - equal_friction
    description: Duct sizing method.
  - name: duct_type
    data_type: string
    allowed_values:
    - round
    - rectangular
    description: Duct geometry.
  optional_inputs:
  - name: material
    data_type: string
    description: Duct material. Deterministic engine default is gss.
  conditional_inputs:
  - name: width_mm
    data_type: number
    description: Existing rectangular duct width in mm; required only when checking an existing rectangular duct.
  - name: height_mm
    data_type: number
    description: Existing rectangular duct height in mm; required only when checking an existing rectangular duct.
  - name: target_velocity_ms
    data_type: number
    required: true
    conditional_on:
      duct_type: round
      method: velocity
    description: Target air velocity in m/s.
  - name: target_friction_pa_per_m
    data_type: number
    required: true
    conditional_on:
      duct_type: round
      method: equal_friction
    description: Target friction rate in Pa/m.
  implementation_binding: skills.hvac.duct_sizing.adapter:DuctSizingSkill
  routing_terms:
  - duct
  - duct size
  - duct sizing
  - cfm duct
  - air velocity
  - equal friction
- skill_id: pump_head
  domain: HVAC
  source_repository: hvac-boq-generator
  source_path: pump-head
  execution: deterministic_python_adapter
  classification: preliminary
  integration_status: integrated
  human_review_required: true
  required_inputs:
  - name: flow_m3hr
    data_type: number
    description: Design water flow rate.
    unit: m3/hr
    required: true
    minimum: 0
    question: What is the design water flow rate in m3/hr?
  - name: diameter_mm
    data_type: number
    description: Pipe internal diameter.
    unit: mm
    required: true
    minimum: 0
    question: What is the pipe diameter in mm?
  - name: straight_length_m
    data_type: number
    description: Straight pipe length.
    unit: m
    required: true
    minimum: 0
    question: What is the straight pipe length in metres?
  - name: static_head_m
    data_type: number
    description: Static head.
    unit: m
    required: true
    minimum: 0
    question: What is the static head in metres?
  - name: margin_pct
    data_type: number
    description: Design margin applied to calculated head.
    unit: '%'
    required: true
    minimum: 0
    question: What design margin percentage should be applied?
  optional_inputs:
  - name: roughness_mm
    data_type: number
    description: Pipe roughness; provide this or a valid pipe material.
    unit: mm
    minimum: 0
  - name: material
    data_type: string
    description: Pipe material used to resolve source-reference roughness when roughness_mm is not supplied.
    allowed_values:
    - gi
    - ms_cs
    - copper
    - upvc_pvc
    - hdpe
  - name: fittings
    data_type: array
    description: Fittings and quantities used for equivalent-length calculation.
  - name: equipment_losses_m
    data_type: array
    description: Equipment/component losses in metres of head.
  conditional_inputs: []
  validation_rules:
  - Provide roughness_mm or a valid material.
  - fittings must be a list when supplied.
  - equipment_losses_m must be a list when supplied.
  implementation_binding: skills.hvac.pump_head.adapter:PumpHeadSkill
  routing_terms:
  - pump head
  - tdh
  - total dynamic head
  - pump sizing
  - pump duty
  - pipe head
